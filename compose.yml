services:
  db:
    image: postgres:18.3-alpine
    volumes:
      - "./.docker/db/data:/var/lib/postgresql"
    ports:
      - 5432:5432
    networks:
      - dataversenet
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: dataverse_db

  localstack:
    image: localstack/localstack:4.2.0
    ports:
      - "4566:4566"
    environment:
      SERVICES: s3
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    volumes:
      - "./.docker/localstack:/var/lib/localstack"
    networks:
      - dataversenet

networks:
  dataversenet: