services:
  db:
    image: postgres:18.3-alpine
    volumes:
      - "./.docker/db/data:/var/lib/postgresql"
    ports:
      - 5432:5432
    networks:
      - dataversenet
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: dataverse_db

networks:
  dataversenet: