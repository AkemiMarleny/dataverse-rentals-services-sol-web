spring.application.name=dataverserentals
spring.datasource.url=${DATASOURCE_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.generate-ddl=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
dataverse.jwt.secret=${JWT_SECRET}
dataverse.jwt.short-expiration=${JWT_SHORT_EXPIRATION:180000}
dataverse.jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:86400000}
dataverse.mfa.encryptor.password=${MFA_ENCRYPTOR_PASSWORD}
dataverse.mfa.encryptor.salt=${MFA_ENCRYPTOR_SALT}
dataverse.s3.region=${S3_REGION:us-east-1}
dataverse.s3.bucket=${S3_BUCKET:dataverse-vouchers}
dataverse.s3.endpoint=${S3_ENDPOINT:}
dataverse.s3.access-key-id=${S3_ACCESS_KEY_ID:}
dataverse.s3.secret-access-key=${S3_SECRET_ACCESS_KEY:}
dataverse.s3.path-style-access=${S3_PATH_STYLE_ACCESS:false}
